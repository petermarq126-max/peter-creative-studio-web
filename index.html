<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peter Creative Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f7f8fb;font-family:Arial,sans-serif}.shell{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.brand{font-size:24px;font-weight:800}.muted{color:#9ca6b7}.btn{background:#1b2130;color:#fff;border:1px solid #343c50;border-radius:10px;padding:10px 13px;cursor:pointer}.primary{background:#7257ff;border-color:#7257ff}.grid{display:grid;grid-template-columns:330px 1fr 260px;gap:16px}.panel{background:#12161f;border:1px solid #252c3b;border-radius:15px;padding:16px}textarea,select{width:100%;background:#0b0d12;color:#fff;border:1px solid #333b50;border-radius:9px;padding:10px;margin:6px 0 14px}textarea{min-height:145px}.canvas{min-height:400px;display:flex;align-items:center;justify-content:center}.canvas img{max-width:100%;max-height:500px;border-radius:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #242b39;font-size:13px}.status{margin-top:14px;padding:11px;background:#171c27;border:1px solid #343c50;border-radius:9px}.hidden{display:none}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:#12161f;border:1px solid #252c3b;border-radius:14px;padding:12px}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}.warn{color:#ffd27b}@media(max-width:900px){.grid{grid-template-columns:1fr}.canvas{min-height:300px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="shell"><div class="top"><div><div class="brand">Peter Creative Studio</div><div class="muted">Milestone 1 • OpenAI + Supabase</div></div><div><button class="btn" id="studioTab">Studio</button> <button class="btn" id="libraryTab">Library</button></div></div><section id="locked" class="panel hidden"><h2>Private Studio</h2><p class="muted">This link is missing its private access token.</p></section><section id="studioView"><div class="grid"><section class="panel"><h3>Create</h3><label>Prompt</label><textarea id="prompt">A premium futuristic creative studio with a glowing violet glass orb on a black pedestal, cinematic product photography, no text.</textarea><label>Aspect ratio</label><select id="ratio"><option>1:1</option><option>9:16</option><option>16:9</option><option>4:5</option></select><label>Quality</label><select id="quality"><option value="low">Low — smoke test</option><option value="standard">Standard</option><option value="high">High</option></select><button class="btn primary" id="estimateBtn">Route + Estimate</button><div id="approval"></div></section><section class="panel canvas" id="canvas"><div class="muted">Output appears here after approval.</div></section><aside class="panel"><h3>Router + Status</h3><div id="router"><div class="row"><span>Provider</span><span>AUTO</span></div><div class="row"><span>Visual QA</span><span class="warn">PENDING</span></div></div></aside></div></section><section id="libraryView" class="hidden"><div class="panel"><h3>Asset Library</h3><div id="libraryStatus" class="muted">Loading…</div><div class="cards" id="cards"></div></div></section></main><script>const API='https://fwhsngnjwwlzdgkrdzrp.supabase.co/functions/v1/studio';const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';const locked=document.getElementById('locked'),studioView=document.getElementById('studioView'),libraryView=document.getElementById('libraryView');if(!token){locked.classList.remove('hidden');studioView.classList.add('hidden')}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path='',options={}){const headers={...(options.headers||{}),'x-studio-token':token};if(options.body)headers['Content-Type']='application/json';const r=await fetch(API+path,{...options,headers});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}function vals(){return{prompt:document.getElementById('prompt').value,aspectRatio:document.getElementById('ratio').value,quality:document.getElementById('quality').value}}document.getElementById('estimateBtn').onclick=async()=>{const box=document.getElementById('approval');box.innerHTML='<div class="status">Routing…</div>';try{const d=await api('',{method:'POST',body:JSON.stringify({action:'estimate',...vals()})});box.innerHTML='<div class="status"><b>Approval required</b><div class="row"><span>Provider</span><span>'+esc(d.estimate.provider)+'</span></div><div class="row"><span>Model</span><span>'+esc(d.estimate.model)+'</span></div><div class="row"><span>Size</span><span>'+esc(d.estimate.size)+'</span></div><div class="row"><span>Quality</span><span>'+esc(d.estimate.quality)+'</span></div><div class="row"><span>Estimated cost</span><span>$'+Number(d.estimate.estimatedUsd).toFixed(3)+'</span></div><button class="btn primary" id="generateBtn">Approve + Generate</button></div>';document.getElementById('router').innerHTML='<div class="row"><span>Provider</span><span>'+esc(d.estimate.provider)+'</span></div><div class="row"><span>Model</span><span>'+esc(d.estimate.model)+'</span></div><div class="row"><span>Visual QA</span><span class="warn">PENDING</span></div>';document.getElementById('generateBtn').onclick=async()=>{box.innerHTML='<div class="status">Generating and persisting…</div>';try{const g=await api('',{method:'POST',body:JSON.stringify({action:'generate',approved:true,...vals()})});document.getElementById('canvas').innerHTML='<img src="'+g.asset.url+'" alt="Generated image">';box.innerHTML='<div class="status">COMPLETED and saved to private Supabase Storage.</div>';document.getElementById('router').innerHTML='<div class="row"><span>Provider</span><span>'+esc(g.asset.provider)+'</span></div><div class="row"><span>Model</span><span>'+esc(g.asset.model)+'</span></div><div class="row"><span>Cost</span><span>$'+Number(g.asset.cost.value).toFixed(3)+' est.</span></div><div class="row"><span>Status</span><span>COMPLETED</span></div><div class="row"><span>Visual QA</span><span class="warn">PENDING</span></div>'}catch(e){box.innerHTML='<div class="status">ERROR '+esc(e.message)+'</div>'}}}catch(e){box.innerHTML='<div class="status">ERROR '+esc(e.message)+'</div>'}};async function loadLibrary(){const status=document.getElementById('libraryStatus'),cards=document.getElementById('cards');status.textContent='Loading…';cards.innerHTML='';try{const d=await api('?action=library');const assets=d.assets||[];status.textContent=assets.length?assets.length+' stored asset(s)':'No assets yet.';cards.innerHTML=assets.map(a=>'<article class="card">'+(a.url?'<img src="'+a.url+'" alt="">':'')+'<h3>'+esc(a.prompt)+'</h3><div class="muted">'+esc(a.provider)+' • '+esc(a.model)+'</div><div class="muted">Generation: '+esc(a.generationStatus)+' • QA: '+esc(a.qaStatus)+'</div></article>').join('')}catch(e){status.textContent='Error: '+e.message}}document.getElementById('studioTab').onclick=()=>{libraryView.classList.add('hidden');studioView.classList.remove('hidden')};document.getElementById('libraryTab').onclick=()=>{studioView.classList.add('hidden');libraryView.classList.remove('hidden');loadLibrary()};</script></body></html>
